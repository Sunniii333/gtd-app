<title>โต๊ะว่าง ใจว่าง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width desk — HUD (clock, energy), next appointment, in-tray, the list for where I am, status chips. Turn-based: nothing moves until you act. */
:root{
  --desk:#E3EBE5; --panel:#F8FBF8; --ink:#18243B; --muted:#56657B; --line:#C7D5CD;
  --note:#FFE27A; --note2:#FFD1DC; --note3:#CDEBFF; --back:#B9C8D8; --note-ink:#2E2500;
  --accent:#2D5BE3; --stamp:#D5363F; --ok:#1C8A57; --warn:#B86E00; --shade:rgba(24,36,59,.14); --scrim:rgba(20,28,44,.45);
  --display:'Mitr','Sarabun',system-ui,sans-serif; --body:'Sarabun',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#111922; --panel:#19232F; --ink:#E6EDF6; --muted:#98A6BA; --line:#2B394B;
  --note:#E6C75A; --note2:#E9A9BB; --note3:#9CC9EA; --back:#3A4A5E; --note-ink:#1F1800;
  --accent:#7FA3FF; --stamp:#FF6B73; --ok:#4FCB8E; --warn:#F0AA3C; --shade:rgba(0,0,0,.4); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#111922; --panel:#19232F; --ink:#E6EDF6; --muted:#98A6BA; --line:#2B394B;
  --note:#E6C75A; --note2:#E9A9BB; --note3:#9CC9EA; --back:#3A4A5E; --note-ink:#1F1800;
  --accent:#7FA3FF; --stamp:#FF6B73; --ok:#4FCB8E; --warn:#F0AA3C; --shade:rgba(0,0,0,.4); --scrim:rgba(0,0,0,.6); color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;-webkit-tap-highlight-color:transparent;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:480px;margin:0 auto;padding-block:10px 28px;display:flex;flex-direction:column;gap:12px}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;
  display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;box-shadow:0 4px 14px var(--shade)}
.hud .day{font-family:var(--display);font-weight:500;font-size:15px}
.hud .day small{display:block;font-family:var(--body);font-weight:400;color:var(--muted);font-size:12px}
.hud .clock{font-family:var(--mono);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;text-align:right}
.hud .clock small{display:block;font-size:11px;color:var(--accent);font-weight:500}
.energy{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.energy .bar{flex:1;height:8px;border-radius:99px;background:var(--desk);overflow:hidden;border:1px solid var(--line)}
.energy .fill{height:100%;transition:width .4s,background .4s}
.energy b{font-family:var(--mono);color:var(--ink);font-size:12px;min-width:3ch;text-align:right}
.next{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:8px 10px;font-size:14px}
.next .grow{flex:1;min-width:0}
.btn{background:var(--accent);color:var(--panel);font-family:var(--display);font-weight:500;border-radius:10px;padding:8px 14px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.big{padding:13px 22px;font-size:17px;border-radius:14px}
.btn.sm{padding:6px 10px;font-size:13px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--display);font-size:14px;color:var(--muted);margin-bottom:8px}
.sec-h b{color:var(--ink);font-weight:500}
.tray-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.note{flex:none;width:112px;min-height:78px;border-radius:4px 4px 4px 14px;padding:8px;background:var(--note);color:var(--note-ink);text-align:left;
  box-shadow:0 3px 0 rgba(0,0,0,.05),0 5px 10px var(--shade);display:flex;flex-direction:column;gap:3px;font-size:12.5px;line-height:1.3}
.note.c2{background:var(--note2)} .note.c3{background:var(--note3)}
.note.down{background:var(--back);color:var(--ink)}
.note .s{opacity:.75;font-size:11px}
.note .t{font-weight:500;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--muted);font-size:13px;padding:8px 4px;text-align:center}
.modes{display:flex;gap:6px;margin-bottom:10px;background:var(--desk);padding:4px;border-radius:12px}
.mode{flex:1;padding:8px 4px;border-radius:9px;font-family:var(--display);font-size:13.5px;display:flex;justify-content:center;gap:5px;align-items:center}
.mode.on{background:var(--panel);box-shadow:0 2px 6px var(--shade);color:var(--accent)}
.mode .n{font-family:var(--mono);font-size:11px;background:var(--line);border-radius:99px;padding:0 6px;color:var(--ink)}
.tasks{display:flex;flex-direction:column;gap:6px}
.task{display:flex;flex-direction:column;gap:2px;text-align:left;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.task:active{background:var(--desk)}
.task .tt{font-size:14.5px}
.task .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.task .tag{font-size:11px;color:var(--accent);font-family:var(--display)}
.due{color:var(--warn);font-weight:600} .due.late{color:var(--stamp)}
.heavy{color:var(--stamp)}
.acts{display:flex;gap:8px}
.acts .btn{flex:1}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.chip b{font-family:var(--mono);font-size:16px;color:var(--ink)}
.chip.hot{border-color:var(--stamp);color:var(--stamp)}
.sheet{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet.modal{z-index:25;align-items:center;padding:16px}
.panel{background:var(--panel);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto;animation:up .2s ease-out}
.modal .panel{border-radius:20px;max-width:380px;padding:18px;animation:pop .2s ease-out}
.panel h4{margin:0 0 8px;font-family:var(--display);font-weight:500;font-size:16px}
.panel p{margin:0 0 12px;color:var(--muted)}
.bignote{background:var(--note);color:var(--note-ink);border-radius:4px 4px 4px 16px;padding:14px;margin-bottom:12px;box-shadow:0 6px 14px var(--shade)}
.bignote.c2{background:var(--note2)} .bignote.c3{background:var(--note3)}
.bignote .t{font-size:17px;font-weight:600;line-height:1.35}
.bignote .meta{font-size:12.5px;opacity:.8;margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
.dests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dest{border:1px solid var(--line);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-size:13px;background:var(--panel)}
.dest .i{font-size:22px}
.dest small{font-family:var(--body);color:var(--muted);font-size:11px}
.dest:active{transform:scale(.96);background:var(--desk)}
.col{display:flex;flex-direction:column;gap:8px}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px}

.mood{height:6px;border-radius:3px;background:var(--desk);overflow:hidden;margin-top:4px}
.mood i{display:block;height:100%}
.progress{font-size:12px;color:var(--muted);margin-bottom:8px}
#toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding-inline:16px}
.toast{background:var(--ink);color:var(--panel);padding:7px 14px;border-radius:99px;font-size:13px;max-width:100%;animation:toast 2.6s ease forwards;font-family:var(--display);text-align:center}
.toast.good{background:var(--ok)} .toast.bad{background:var(--stamp)} .toast.warn{background:var(--warn)}

.scr{max-width:460px;margin:0 auto;padding-block:28px 40px;display:flex;flex-direction:column;gap:16px}
.logo{font-family:var(--display);font-weight:600;font-size:clamp(40px,12.5vw,58px);line-height:1.15;margin:24px 0 0;text-wrap:balance}
.logo span{display:inline-block;background:var(--note);color:var(--note-ink);padding:2px 12px;border-radius:4px 4px 4px 14px;box-shadow:0 6px 14px var(--shade)}

.bubble{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.who{display:flex;align-items:center;gap:10px;font-family:var(--display)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--note3);display:grid;place-items:center;font-size:22px}
.tip{display:flex;gap:10px;font-size:15px}
.tip .i{font-size:20px;flex:none;width:26px;text-align:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stars{font-size:38px;letter-spacing:6px;text-align:center}
.stars .off{opacity:.2}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:5px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.days{display:flex;gap:6px;justify-content:center}
.days span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-family:var(--display);font-size:13px}
.days span.done{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.days span.cur{border-color:var(--accent);color:var(--accent)}
.perk{display:flex;gap:12px;align-items:center;text-align:left;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel)}
.perk .i{font-size:28px}
.perk small{display:block;color:var(--muted)}
.perk:active{border-color:var(--accent)}
.perklist{display:flex;flex-wrap:wrap;gap:6px;font-size:18px}
h2{font-family:var(--display);font-weight:500;font-size:26px;margin:0;text-wrap:balance}
@keyframes pop{from{transform:scale(.95);opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes toast{0%{opacity:0;transform:translateY(-8px)}8%,82%{opacity:1;transform:none}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const rnd=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=m=>{m=Math.round(m);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const $=id=>document.getElementById(id);
const dur=m=>m>=60?(m/60)+' ชม.':m+' นาที';

// ================= state =================
let S=null;
function fresh(){return{week:1,day:0,min:540,energy:100,score:0,stars:0,dayPts:0,dayPot:0,tray:[],lists:{pc:[],phone:[],walk:[]},mode:'pc',
  waiting:[],calendar:[],cabinet:[],drawer:[],clients:[],ev:[],pop:[],perks:[],week_log:[],used:{},uid:1,reviewed:false,reviewQ:0,clar:null,phase:'title',nextClient:0}}
const id=()=>S.uid++;
const has=u=>S.week>1||UNL.slice(0,S.day+1).flat().includes(u);
const perk=p=>S.perks.includes(p);
const rankIdx=()=>{let r=0;RANKS.forEach(([n],i)=>{if(S.stars>=n)r=i});return r};
function save(){try{localStorage.setItem('toh-wang-v1',JSON.stringify(S))}catch(e){}}
function load(){try{const j=localStorage.getItem('toh-wang-v1');return j?JSON.parse(j):null}catch(e){return null}}

// ================= items =================
function pick(k){const pool=P[k],u=S.used[k]||(S.used[k]=[]);let c=pool.map((_,i)=>i).filter(i=>!u.includes(i));if(!c.length){S.used[k]=[];c=pool.map((_,i)=>i)}const i=rnd(c);S.used[k].push(i);return pool[i]}
function kinds(){const k={junk:2,quick:3,task:4};if(has('deleg'))k.deleg=2;if(has('cab'))k.info=1.5;if(has('cal'))k.meeting=1.2;if(has('drawer'))k.idea=1.2;return k}
function gen(kind){
  if(!kind){const k=kinds(),t=Object.values(k).reduce((a,b)=>a+b,0);let r=Math.random()*t;kind='quick';for(const [n,w] of Object.entries(k))if((r-=w)<=0){kind=n;break}}
  const it={id:id(),kind,color:rnd(['','','c2','c3']),sender:rnd(SENDERS)};
  if(kind==='junk')it.title=pick('junk'),it.sender=rnd(['📧 อีเมลจากข้างนอก','📄 เอกสารวางบนโต๊ะ','💬 แชทจากเพื่อนร่วมงาน']);
  if(kind==='quick')Object.assign(it,{title:pick('quick'),ctx:'pc',dur:2});
  if(kind==='task'){let t;do t=pick('task');while(!has(t[1]));Object.assign(it,{title:t[0],ctx:t[1],dur:t[2],heavy:!!t[3]});
    if(Math.random()<.4){const due=Math.ceil((S.min+180+Math.random()*150)/30)*30;if(due<=1050){it.due=due;it.sender='📧 อีเมลจากหัวหน้า'}}}
  if(kind==='deleg'){const [t,r]=pick('deleg');Object.assign(it,{title:t,role:r,ctx:'pc',dur:60,heavy:true})}
  if(kind==='info'){const [t,q]=pick('info');Object.assign(it,{title:t,q});sched(S.min+120+Math.random()*180,'q',{id:it.id,q})}
  if(kind==='meeting'){const t=Math.ceil((S.min+100+Math.random()*120)/30)*30;if(t>1020)return gen('quick');
    Object.assign(it,{title:pick('meeting'),time:t});sched(t,'meet',{id:it.id})}
  if(kind==='idea'){Object.assign(it,{title:pick('idea'),ctx:'pc',dur:60,heavy:true});
    if(S.day<4&&Math.random()<.25){it.title='ประกาศ: สัมมนาฟรี เปิดรับสมัครวัน'+DAYN[S.day+1];it.returnDay=S.day+1;it.becomes='สมัครสัมมนาฟรี (เปิดรับวันนี้!)'}}
  S.dayPot+=valueOf(it);return it;
}
function valueOf(it){return{junk:2,quick:6,deleg:14,info:14,meeting:15,idea:3,step:10,client:80}[it.kind]??(it.dur/15*6+(it.heavy?4:0)+(it.due?10:0))}
function sched(at,type,data){S.ev.push({at,type,...data})}
function spawnClient(){const c=CLIENTS[S.nextClient%CLIENTS.length];S.nextClient++;
  const it={id:id(),kind:'client',ci:(S.nextClient-1)%CLIENTS.length,title:`${c.name}: ${c.need}`,sender:'📨 ลูกค้าใหม่',color:'c3'};S.dayPot+=80;S.tray.push(it)}
function stepItem(c){const [t,ctx,d,h]=c.steps[c.idx];return{id:id(),kind:'step',clientId:c.id,title:t,tag:c.name,ctx,dur:d,heavy:!!h,opened:true,color:'c3',sender:'📁 แฟ้มลูกค้า'}}

// ================= time =================
function toast(msg,kind=''){const d=document.createElement('div');d.className='toast '+kind;d.textContent=msg;$('toasts').appendChild(d);setTimeout(()=>d.remove(),2700);while($('toasts').children.length>3)$('toasts').firstChild.remove()}
function gain(n,msg){S.score+=n;S.dayPts+=n;toast(msg+' +'+Math.round(n),'good')}
function lose(n,msg){S.score-=n;S.dayPts-=n;toast(msg+' −'+n,'bad')}
function advance(m){
  const end=S.min+m;
  for(;;){const due=S.ev.filter(e=>e.at<=end).sort((a,b)=>a.at-b.at)[0];if(!due)break;S.ev=S.ev.filter(e=>e!==due);S.min=Math.max(S.min,due.at);fire(due)}
  // clients get restless while nothing of theirs is moving
  for(const c of S.clients){if(c.done||c.gone)continue;if(!inMotion(c)){c.mood-=m*8/60;if(c.mood<=0){c.gone=true;lose(15,`${c.name}เปลี่ยนไปจ้างที่อื่นแล้ว`);S.tray=S.tray.filter(x=>x.clientId!==c.id);for(const k in S.lists)S.lists[k]=S.lists[k].filter(x=>x.clientId!==c.id)}}else c.mood=Math.min(100,c.mood+m/6)}
  S.min=end;
  for(const it of allTasks())if(it.due&&!it.late&&S.min>it.due){it.late=true;
    if(!it.opened&&S.tray.includes(it)){it.opened=true;lose(10,'หัวหน้าทวง: งานที่ส่งมาเมื่อเช้าเลยกำหนดแล้ว!')}else lose(10,`เลยกำหนด: ${it.title}`)}
}
function allTasks(){return[...S.tray,...Object.values(S.lists).flat()]}
function fire(e){
  if(e.type==='mail'){const n=e.n;for(let i=0;i<n;i++)S.tray.push(gen());toast(`📬 จดหมายรอบใหม่ ${n} แผ่น`)}
  if(e.type==='client'){if(has('client'))spawnClient(),toast('📨 มีลูกค้าใหม่ติดต่อมา')}
  if(e.type==='lunch')S.pop.push({type:'lunch'});
  if(e.type==='meet'){const it=S.calendar.find(x=>x.id===e.id);
    if(it)S.pop.push({type:'meet',id:e.id,title:it.title,start:e.at});
    else{const t=S.tray.find(x=>x.id===e.id);S.tray=S.tray.filter(x=>x.id!==e.id);lose(10,t&&!t.opened?'มีนัดที่ซ่อนอยู่ในถาด พลาดไปแล้ว':'พลาดนัด! ไม่ได้ลงปฏิทินไว้')}}
  if(e.type==='q')S.pop.push({type:'q',id:e.id,q:e.q});
  if(e.type==='ret'){const w=S.waiting.find(w=>w.item.id===e.id);if(!w)return;
    if(w.willStale){w.willStale=false;w.stale=true;sched(e.at+240,'lost',{id:e.id});toast(`💤 ${ROLES[w.role].name}เงียบไปเลยเรื่อง "${w.item.title}"`,'warn')}
    else{S.waiting=S.waiting.filter(x=>x!==w);gain(14,`${ROLES[w.role].name}: ${w.item.title} เรียบร้อย`)}}
  if(e.type==='lost'){const w=S.waiting.find(w=>w.item.id===e.id);if(w&&w.stale){S.waiting=S.waiting.filter(x=>x!==w);lose(8,`${ROLES[w.role].name}ลืมเรื่อง "${w.item.title}" ไปแล้ว`)}}
  if(e.type==='complain')lose(8,`หัวหน้า: เรื่อง "${e.title}" ไปถึงไหนแล้ว?`);
  if(e.type==='back'){S.tray.push(e.item);toast(e.msg,'warn')}
}
function inMotion(c){const f=x=>x.kind==='step'&&x.clientId===c.id;return Object.values(S.lists).some(l=>l.some(f))||S.waiting.some(w=>f(w.item))}
function stalled(){return S.clients.filter(c=>!c.done&&!c.gone&&!inMotion(c))}
function speed(ctx){return(ctx==='pc'&&perk('phones'))||(ctx==='phone'&&perk('mobile'))||(ctx==='walk'&&perk('shoes'))?.8:1}
function workTime(it,fromList){let t=it.dur*speed(it.ctx);if(it.heavy&&S.energy<35)t*=1.5;return Math.round(t+(fromList?5:0))}
function drain(it){S.energy=Math.max(0,S.energy-(it.heavy?it.dur/15*6:it.dur/15*2))}

// ================= actions =================
function doWork(it,fromList){
  const t=workTime(it,fromList);drain(it);advance(t);complete(it);
  if(has('capture')&&it.dur>=30&&Math.random()<.4)S.pop.push({type:'thought',title:pick('thought')});
}
function complete(it){
  let p=it.value??valueOf(it);if(it.due)p-=10;
  if(it.due&&!it.late){p+=10}
  if(it.late)p=Math.round(p/2);
  gain(p,it.late?'เสร็จ (เลยกำหนด)':it.due?'ทันกำหนด!':'เสร็จ!');
  if(it.kind==='step'){const c=S.clients.find(c=>c.id===it.clientId);if(c&&!c.gone){c.idx++;
    if(c.idx>=c.steps.length){c.done=true;gain(40,`${c.name} ปลื้มมาก งานครบทุกขั้น`)}
    else S.pop.push({type:'next',clientId:c.id,item:stepItem(c)})}}
}
function misfit(it,msg){toast(msg,'warn');return false}
function route(it,d,role){
  const k=it.kind;
  if(d==='trash'){
    if(k==='junk'){gain(2,'ทิ้งแล้ว');return true}
    if(k==='client'){lose(15,'ลูกค้าโทรมาต่อว่า ไม่มีใครติดต่อกลับเลย');return true}
    if(k==='step'){const c=S.clients.find(c=>c.id===it.clientId);if(c)c.mood-=30;toast(`${it.tag}: ขั้นนี้ยังต้องทำนะ!`,'bad');return false}
    if(['quick','task','deleg'].includes(k))sched(S.min+120+Math.random()*120,'complain',{title:it.title});
    toast('ทิ้งแล้ว');return true;
  }
  if(d==='now'){
    if(k==='junk'){advance(5);S.score-=2;S.dayPts-=2;toast('อ่านโฆษณาจนจบ เสียเวลาฟรี ๆ −2','bad');return true}
    if(k==='info'){toast('อ่านแล้ว… แต่จะจำได้ไหมนะ');return true}
    if(k==='meeting')return misfit(it,'ยังไม่ถึงเวลานัดเลย');
    if(k==='client')return misfit(it,'งานใหญ่ขนาดนี้ทำรวดเดียวไม่จบหรอก');
    if(it.returnDay!=null){advance(10);toast('ยังไม่เปิดรับสมัครเลย ต้องรอวัน'+DAYN[it.returnDay],'warn');return false}
    doWork(it,false);return true;
  }
  if(CTX[d]){
    if(k==='junk'){S.score-=2;S.dayPts-=2;toast('ใส่โฆษณาไว้ในลิสต์? ทิ้งให้แล้วกัน −2','bad');return true}
    if(k==='info')return misfit(it,'อันนี้ไม่มีอะไรต้องทำ แค่อาจต้องใช้ทีหลัง');
    if(k==='meeting')return misfit(it,'นัดที่มีเวลาแน่นอน ควรอยู่ที่อื่นนะ');
    if(k==='client')return misfit(it,'งานลูกค้ามีหลายขั้น ต้องเปิดแฟ้มก่อน');
    if(it.ctx!==d)return misfit(it,`งานนี้ทำจาก${CTX[d].n}ไม่ได้นะ`);
    S.lists[d].push(it);toast(`ใส่${CTX[d].list}แล้ว`);return true;
  }
  if(d==='deleg'){const r=ROLES[role];
    if(k==='deleg'&&it.role===role){const t=perk('buddy')?60+Math.random()*60:90+Math.random()*90;
      S.waiting.push({item:it,role,willStale:Math.random()<(perk('buddy')?.1:.3),stale:false});sched(S.min+t,'ret',{id:it.id});toast(`ฝาก${r.name}แล้ว`);return true}
    sched(S.min+60,'back',{item:it,msg:`${r.name}: อันนี้ไม่ใช่งานฝ่าย${r.dept}นะ ส่งคืน`});toast(`ส่งให้${r.name}แล้ว…`);return true}
  if(d==='cal'){if(k==='meeting'){S.calendar.push(it);toast('ลงปฏิทินแล้ว');return true}return misfit(it,'ไม่มีเวลานัดให้ลงปฏิทินนะ')}
  if(d==='cab'){if(k==='info'){S.cabinet.push(it);toast('เก็บเข้าตู้แล้ว');return true}if(k==='junk'){S.score-=2;toast('เก็บโฆษณาไว้ทำไมนะ −2','bad');return true}return misfit(it,'อันนี้ต้องมีคนลงมือ ไม่ใช่แค่เก็บไว้')}
  if(d==='drawer'){if(k==='idea'){S.drawer.push(it);toast('เก็บไว้ในลิ้นชัก');return true}if(k==='junk'){S.score-=2;toast('ลิ้นชักไม่ใช่ถังขยะ −2','bad');return true}return misfit(it,'อันนี้รอไม่ได้นะ')}
  if(d==='client'){if(k!=='client')return misfit(it,'นี่ไม่ใช่ลูกค้าใหม่');
    const c={id:id(),name:CLIENTS[it.ci].name,steps:CLIENTS[it.ci].steps,idx:0,mood:100};S.clients.push(c);
    S.pop.push({type:'next',clientId:c.id,item:stepItem(c),first:true});toast('เปิดแฟ้มลูกค้าแล้ว');return true}
}
function after(){
  if(S.phase!=='play')return;
  if(S.min<1020&&!S.clar&&Math.random()<.12){S.tray.push(gen());toast('💬 มีเรื่องเข้าถาดเพิ่ม')}
  if(!S.pop.length&&S.min>=1080){endDay();return}
  render();
}

// ================= render =================
function render(){
  if(S.phase!=='play')return;
  // opening a face-down sheet in the tray costs 2 minutes of reading
  if(S.clar&&S.tray.length){const it=S.tray[Math.min(S.clar.i,S.tray.length-1)];if(!it.opened){it.opened=true;advance(2)}}
  const e=S.energy,col=e>60?'var(--ok)':e>35?'var(--warn)':'var(--stamp)';
  const unopened=S.tray.filter(x=>!x.opened).length;
  const ms=Object.keys(CTX).filter(has);

    <div class="clock">${fmt(S.min)}<small>${S.min>=1020?'เลิกงานได้แล้ว':S.min<720?'ช่วงเช้า':'ช่วงบ่าย'}</small></div>
    <div class="energy"><span>🔋 แรง</span><div class="bar"><div class="fill" style="width:${Math.min(100,e)}%;background:${col}"></div></div><b>${Math.round(e)}</b></div></header>`;
  if(nm)h+=`<div class="next"><span>📅</span><div class="grow">นัดถัดไป <b>${fmt(nm.time)}</b> ${esc(nm.title)}</div>${nm.time-S.min<=90&&nm.time>S.min?`<button class="btn sm" data-a="wait">⏩ ไปรอ</button>`:''}</div>`;
  h+=`<section class="box"><div class="sec-h"><span><b>📥 ถาดเข้า</b> ${S.tray.length} แผ่น${unopened?` · ยังไม่เปิด ${unopened}`:''}</span>
    ${S.tray.length?`<button class="btn sm" data-a="clar">เคลียร์ถาด</button>`:''}</div>
    ${S.tray.length?`<div class="tray-row">${S.tray.map((it,i)=>it.opened
      ?`<button class="note ${it.color}" data-a="clar" data-v="${i}"><span class="s">${esc(it.tag?'📁 '+it.tag:it.sender)}</span><span class="t">${esc(it.title)}</span>${it.late?'<span class="s due late">เลยกำหนด</span>':it.due?`<span class="s due">ก่อน ${fmt(it.due)}</span>`:''}</button>`
      :`<button class="note down" data-a="clar" data-v="${i}"><span class="s">ยังไม่เปิด</span><span class="t">${esc(it.sender)}</span></button>`).join('')}</div>`
    :'<div class="empty">ถาดว่าง หัวโล่ง 😌</div>'}</section>`;
  h+=`<section class="box"><div class="modes">${ms.map(m=>`<button class="mode ${S.mode===m?'on':''}" data-a="mode" data-v="${m}">${CTX[m].i} ${CTX[m].n}<span class="n">${S.lists[m].length}</span></button>`).join('')}</div>
    <div class="tasks">${L.length?L.map(it=>{const t=workTime(it,true);return`<button class="task" data-a="work" data-v="${it.id}">
      ${it.tag?`<span class="tag">📁 ${esc(it.tag)}</span>`:''}<span class="tt">${esc(it.title)}</span>
      <span class="meta"><span>⏱ ${dur(t)}</span>${it.heavy?`<span class="heavy">💪 หนัก${S.energy<35?' · เหนื่อยอยู่ ช้าลง':''}</span>`:'<span>🍃 เบา</span>'}
      ${it.due?`<span class="due ${it.late?'late':''}">${it.late?'เลยกำหนดแล้ว':'ก่อน '+fmt(it.due)}</span>`:''}${nm&&nm.time>S.min&&S.min+t>nm.time?'<span class="due">จะไปประชุมสาย</span>':''}</span></button>`}).join('')
      :`<div class="empty">ลิสต์${CTX[S.mode].n}ว่าง${S.tray.length?' ลองเคลียร์ถาดดูไหม':''}</div>`}</div></section>`;
  h+=`<div class="acts"><button class="btn ghost" data-a="rest">☕ พัก 15 นาที</button>
    ${has('review')&&S.day===4&&!S.reviewed?`<button class="btn" data-a="review" ${S.min<900?'disabled':''}>🔍 ทบทวน${S.min<900?' (บ่ายสาม)':''}</button>`:''}
    <button class="btn ghost" data-a="home" ${S.min<1020?'disabled':''}>🏠 กลับบ้าน${S.min<1020?' (5 โมง)':''}</button></div>`;
  const chips=[];
  if(has('deleg'))chips.push(['waiting','🤝','รอคนอื่น',S.waiting.length,S.waiting.some(w=>w.stale)]);
  if(has('cal'))chips.push(['cal','📅','ปฏิทิน',S.calendar.length,false]);
  if(has('cab'))chips.push(['cab','🗄️','ตู้',S.cabinet.length,false]);

  if(chips.length)h+=`<div class="chips">${chips.map(([k,i,n,c,hot])=>`<button class="chip ${hot?'hot':''}" data-a="view" data-v="${k}"><span>${i} ${n}</span><b>${c}</b></button>`).join('')}</div>`;
  $('app').innerHTML=h;

function renderPop(){
  const p=S.pop[0];$('modal').hidden=!p;if(!p)return;let h='';
  if(p.type==='lunch')h=`<h4>🍜 เที่ยงแล้ว</h4><p>พักกินข้าวหนึ่งชั่วโมง แรงจะฟื้นกลับมา</p><button class="btn big" style="width:100%" data-a="p" data-v="eat">ไปกินข้าว</button>`;

  if(p.type==='next'){const it=p.item;h=`<h4>📁 ${esc(it.tag)}</h4><p>${p.first?'ขั้นแรกของงานนี้คือ':'ขั้นก่อนหน้าเสร็จแล้ว ขั้นต่อไปคือ'}</p>
    <div class="bignote c3"><div class="t">${esc(it.title)}</div><div class="meta"><span>⏱ ${dur(it.dur)}</span><span>${it.heavy?'💪 หนัก':'🍃 เบา'}</span></div></div>
    <p style="margin-bottom:8px">ใส่ลิสต์ไหนดี?</p><div class="dests">${Object.keys(CTX).filter(has).map(c=>`<button class="dest" data-a="p" data-v="ctx:${c}"><span class="i">${CTX[c].i}</span>${CTX[c].list}</button>`).join('')}
    <button class="dest" data-a="p" data-v="later"><span class="i">📥</span>ไว้คิดทีหลัง</button></div>`}
  $('modalBody').innerHTML=h;
}
function resolvePop(v){
  const p=S.pop.shift();
  if(p.type==='lunch'){advance(60);S.energy=Math.min(110,S.energy+40+(perk('lunch')?20:0));toast('อิ่มแล้ว แรงกลับมา 🔋','good')}
  if(p.type==='meet'){S.calendar=S.calendar.filter(x=>x.id!==p.id);
    if(v==='go'){const late=S.min-p.start;advance(30);S.energy=Math.max(0,S.energy-4);late<=0?gain(15,'ประชุมตรงเวลา'):late<30?gain(8,'ประชุม (มาสาย)'):lose(5,'มาสายจนประชุมจบแล้ว')}
    else lose(10,'ไม่ไปประชุมตามนัด')}
  if(p.type==='q'){const ok=S.cabinet.some(x=>x.id===p.id);
    if(v==='find'){if(!perk('cabinet'))advance(5);ok?gain(perk('cabinet')?20:14,'เจอในตู้แล้ว!'):lose(5,'ค้นทั้งตู้ก็ไม่เจอ')}else lose(5,'ตอบไม่ได้')}
  if(p.type==='thought'){
    if(v==='jot'){const it={id:id(),kind:'quick',title:p.title,ctx:'pc',dur:2,opened:true,color:'c2',sender:'💭 เรื่องที่นึกได้'};S.dayPot+=6;S.tray.push(it);toast('จดไว้แล้ว ไปต่อได้เลย')}
    if(v==='now'){advance(15);S.energy=Math.max(0,S.energy-3);gain(6,'จัดการแล้ว แต่เสียจังหวะไปหน่อย')}
    if(v==='forget'&&Math.random()<.6)sched(S.min+90+Math.random()*120,'complain',{title:p.title})}
  if(p.type==='next'){
    if(v==='later'){S.tray.push(p.item);toast('ลงถาดไว้ก่อน อย่าลืมกลับมาดูนะ','warn')}
    else{const c=v.split(':')[1];if(c===p.item.ctx){S.lists[c].push(p.item);toast(`ใส่${CTX[c].list}แล้ว งานลูกค้าเดินต่อ`)}
      else{S.tray.push(p.item);toast(`งานนี้ทำจาก${CTX[c].n}ไม่ได้ ลงถาดไว้ก่อน`,'warn')}}}
  after();
}

// ================= sheets =================
function sheet(h){$('sheetBody').innerHTML=h;$('sheet').hidden=false}
function closeSheet(){$('sheet').hidden=true;S&&(S.clar=null)}
function renderClar(){
  const i=Math.min(S.clar.i,S.tray.length-1);if(i<0||!S.tray.length){closeSheet();toast('ถาดว่างแล้ว หัวโล่ง 😌','good');return}
  S.clar.i=i;const it=S.tray[i];
  const dests=[['trash','🗑️','ทิ้ง'],['now','⚡','ทำเลย',it.dur?dur(workTime(it,false)):''],['pc','💻','ลิสต์คอม'],['phone','📞','ลิสต์โทร'],['walk','🚶','ลิสต์เดิน'],
    ['deleg','🤝','ส่งต่อ…'],['cal','📅','ลงปฏิทิน'],['cab','🗄️','เก็บเข้าตู้'],['drawer','🌙','ลิ้นชัก'],['client','📁','เปิดแฟ้ม']].filter(([d])=>has(d));
  const meta=[];if(it.dur)meta.push('⏱ '+dur(it.dur),it.heavy?'💪 หนัก':'🍃 เบา');if(it.due)meta.push((it.late?'เลยกำหนด ':'ต้องเสร็จก่อน ')+fmt(it.due));if(it.time)meta.push('📅 นัดเวลา '+fmt(it.time));
  sheet(S.clar.deleg?`<h4>ส่งต่อให้ใคร?</h4><div class="bignote ${it.color}"><div class="t">${esc(it.title)}</div></div>
    <div class="dests">${Object.entries(ROLES).map(([k,r])=>`<button class="dest" data-a="to" data-v="deleg:${k}"><span class="i">${r.i}</span>${r.name}<small>${r.dept}</small></button>`).join('')}</div>
    <div style="margin-top:10px"><button class="btn ghost" data-a="back">← กลับ</button></div>`
  :`<div class="progress">แผ่นที่ ${i+1} จาก ${S.tray.length} · ${fmt(S.min)} · แต่ละแผ่นใช้เวลาอ่าน 2 นาที</div>
    <div class="bignote ${it.color}"><div class="meta" style="margin:0 0 6px"><span>${esc(it.tag?'📁 '+it.tag:it.sender)}</span></div><div class="t">${esc(it.title)}</div>${meta.length?`<div class="meta">${meta.map(esc).join(' · ')}</div>`:''}</div>
    <div class="dests">${dests.map(([d,ic,l,sub])=>`<button class="dest" data-a="to" data-v="${d}"><span class="i">${ic}</span>${l}${sub?`<small>${sub}</small>`:''}</button>`).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:12px">${S.tray.length>1?`<button class="btn ghost" data-a="skip">ข้ามแผ่นนี้</button>`:''}<button class="btn ghost" data-a="close" style="margin-left:auto">พอก่อน</button></div>`);
}
function renderView(v){
  let h='';
  if(v==='waiting')h=`<h4>🤝 รอคนอื่นทำ</h4><div class="rows">${S.waiting.map(w=>`<div class="row"><span>${ROLES[w.role].i}</span><div class="grow">${esc(w.item.title)}<br><small>${ROLES[w.role].name} · ${w.stale?'💤 เงียบไป':'กำลังทำ'}</small></div>
    ${w.stale?`<button class="btn sm" data-a="nudge" data-v="${w.item.id}">ทวง (5 นาที)</button>`:''}</div>`).join('')||'<div class="empty">ยังไม่ได้ฝากงานใคร</div>'}</div>`;
  if(v==='cal')h=`<h4>📅 นัดวันนี้</h4><div class="rows">${[...S.calendar].sort((a,b)=>a.time-b.time).map(x=>`<div class="row"><b style="font-family:var(--mono)">${fmt(x.time)}</b><div class="grow">${esc(x.title)}</div></div>`).join('')||'<div class="empty">ปฏิทินว่าง</div>'}</div>`;
  if(v==='cab')h=`<h4>🗄️ ตู้เอกสาร</h4><div class="rows">${S.cabinet.map(x=>`<div class="row">📄<div class="grow">${esc(x.title)}</div></div>`).join('')||'<div class="empty">ตู้ยังว่าง</div>'}</div>`;
  if(v==='drawer')h=`<h4>🌙 ลิ้นชัก</h4><div class="rows">${S.drawer.map(x=>`<div class="row">💡<div class="grow">${esc(x.title)}${x.returnDay!=null?`<br><small>จะกลับมาวัน${DAYN[x.returnDay]}</small>`:''}</div></div>`).join('')||'<div class="empty">ลิ้นชักว่าง</div>'}</div>`;
  if(v==='clients')h=`<h4>📁 แฟ้มลูกค้า</h4><div class="rows">${S.clients.filter(c=>!c.gone&&!c.done).map(c=>{const mv=inMotion(c),m=Math.max(0,c.mood);
    return`<div class="row"><div class="grow"><b>${esc(c.name)}</b> <small>ขั้น ${c.idx+1}/${c.steps.length}</small><br><small>${mv?'มีงานเดินอยู่':'ไม่มีขั้นไหนเดินอยู่ ลูกค้าเริ่มหงุดหงิด'}</small>
    <div class="mood"><i style="width:${m}%;background:${m>60?'var(--ok)':m>30?'var(--warn)':'var(--stamp)'}"></i></div></div></div>`}).join('')||'<div class="empty">ยังไม่มีลูกค้า</div>'}</div>`;
  if(v==='review'){const cs=reviewChecks();h=`<h4>🔍 ทบทวนประจำสัปดาห์</h4><p>ใช้เวลา 1 ชั่วโมง ยิ่งเช็กผ่านมาก สัปดาห์หน้ายิ่งได้เลือกของดีมากขึ้น</p>
    <div class="rows">${cs.map(([t,ok])=>`<div class="row"><span>${ok?'✅':'⬜'}</span><div class="grow">${esc(t)}</div></div>`).join('')}
    <div class="row"><span>💡</span><div class="grow">ไล่ดูลิ้นชัก ${S.drawer.length} ไอเดีย<br><small>ไอเดียดี ๆ กลายเป็นข้อเสนอให้หัวหน้า ได้แต้มเพิ่ม</small></div></div></div>

function reviewChecks(){return[['ถาดเข้าว่างเปล่า',!S.tray.length],['ไม่มีใครเงียบหายค้างอยู่',!S.waiting.some(w=>w.stale)],['ลูกค้าทุกรายมีขั้นต่อไปเดินอยู่',!stalled().length]]}

// ================= days =================
function scheduleDay(){
  const L=rankIdx(),per=S.week===1?[3,2,2,1]:[2,2,2,2].map((n,i)=>n+(L>=2&&i<2?1:0)+(L>=4&&i>=2?1:0));
  [[S.min,per[0]],[660,per[1]],[840,per[2]],[960,per[3]]].forEach(([at,n])=>sched(at,'mail',{n}));
  sched(720,'lunch',{});
  if(has('client')){const active=S.clients.filter(c=>!c.done&&!c.gone).length,cap=Math.min(3,1+Math.floor(L/2));
    if(S.week===1&&S.day===3){sched(600,'client',{})}
    else if(S.week>1&&(S.day===0||S.day===2)&&active<cap)sched(570+Math.random()*240,'client',{})}
}
function startDay(){
  S.min=perk('early')?510:540;S.energy=perk('plant')?110:100;S.dayPts=0;S.dayPot=20;S.reviewed=S.day===4?false:S.reviewed;S.mode='pc';S.calendar=[];S.clar=null;S.pop=[];
  S.ev=S.ev.map(e=>['meet','lunch','mail','client'].includes(e.type)?null:{...e,at:S.min+30+Math.random()*120}).filter(Boolean);
  const due=S.drawer.filter(x=>x.returnDay===S.day);S.drawer=S.drawer.filter(x=>x.returnDay!==S.day);
  due.forEach(x=>{S.tray.unshift({id:id(),kind:'task',title:x.becomes,ctx:'pc',dur:15,heavy:false,value:20,opened:true,color:'c2',sender:'🌙 จากลิ้นชัก'});S.dayPot+=20});
  S.phase='intro';save();showIntro(due.length);
}
function begin(){S.phase='play';scheduleDay();advance(0);hideScreen();after()}
function endDay(){
  closeSheet();
  const cs=[['ถาดเข้าว่างก่อนกลับบ้าน',!S.tray.length,10],['ไม่มีงานค้างเลยกำหนด',!allTasks().some(x=>x.late),10]];
  cs.forEach(([t,ok,p])=>{if(ok){S.score+=p;S.dayPts+=p}});
  const r=S.dayPts/Math.max(40,S.dayPot),stars=r>=.6?3:r>=.4?2:r>=.2?1:0;
  S.stars+=stars;S.week_log[S.day]={pts:Math.round(S.dayPts),stars};
  // pending decisions (meetings, lunch, questions) do not follow you home
  S.pop=[];S.phase='summary';save();showSummary(cs,stars);
}
function nextDay(){if(S.day===4){showWeekend();return}S.day++;startDay()}

function showScreen(h){$('screen').innerHTML=h;$('screen').hidden=false;$('screen').scrollTop=0;$('app').hidden=true;$('sheet').hidden=true;$('modal').hidden=true}
function hideScreen(){$('screen').hidden=true;$('app').hidden=false}
const dots=()=>`<div class="days">${DAYS.map((n,i)=>`<span class="${S.week_log[i]?'done':''} ${i===S.day&&!S.week_log[i]?'cur':''}">${n}</span>`).join('')}</div>`;
const mentor=(b)=>`<div class="bubble"><div class="who"><div class="avatar">👩🏻‍💼</div>พี่นุ่น · หัวหน้าทีม</div>${b}</div>`;
function showTitle(){
  const s=load(),can=s&&(s.phase==='intro'||s.phase==='summary');
  showScreen(`<div class="scr"><h1 class="logo"><span>โต๊ะว่าง</span> <span>ใจว่าง</span></h1>
    <p class="sub">ชีวิตพนักงานออฟฟิศแบบไม่ต้องรีบ เลือกงานให้ถูกเวลา จัดโต๊ะให้โล่ง แล้วไต่ตำแหน่งไปเรื่อย ๆ</p>
    ${can?`<button class="btn big" data-a="cont">เล่นต่อ · สัปดาห์ ${s.week} วัน${DAYN[s.day]}</button><button class="btn big ghost" data-a="new">เริ่มใหม่ตั้งแต่วันแรก</button>`
      :`<button class="btn big" data-a="new">เริ่มงานวันแรก</button>`}
    <p class="sub" style="font-size:13px">เกมแบบผลัด นาฬิกาเดินเฉพาะตอนเราทำอะไร · วันละ 3–5 นาที · เซฟอัตโนมัติทุกเช้า</p></div>`)}
function showIntro(tickler){
  const t=S.week===1?TUT[S.day]:null;
  showScreen(`<div class="scr">${dots()}<h2>สัปดาห์ ${S.week} · วัน${DAYN[S.day]}</h2>
    ${t?mentor(`<div>${esc(t.hello)}</div>${t.tips.map(([i,x])=>`<div class="tip"><span class="i">${i}</span><span>${esc(x)}</span></div>`).join('')}`)
      :`<div class="card"><div class="kv"><span>ตำแหน่ง</span><b>${RANKS[rankIdx()][1]}</b></div><div class="kv"><span>ดาวสะสม</span><b>★ ${S.stars}</b></div>
       <div class="kv"><span>ของติดโต๊ะ</span><span class="perklist">${S.perks.map(p=>PERKS[p][0]).join('')||'—'}</span></div></div>`}
    ${S.tray.length||S.clients.some(c=>!c.done&&!c.gone)?`<div class="card" style="font-size:14px;color:var(--muted)">ของเมื่อวานยังอยู่ครบ ถาด ${S.tray.length} แผ่น ลิสต์ ${Object.values(S.lists).flat().length} งาน${tickler?' · มีของจากลิ้นชักกลับมาด้วย':''}</div>`:''}
    <button class="btn big" data-a="play">เข้างาน ${fmt(S.min)}</button></div>`)}
function showSummary(cs,stars){
  const w=S.week_log[S.day];
  showScreen(`<div class="scr">${dots()}<h2>จบวัน${DAYN[S.day]}</h2><div class="stars">${[0,1,2].map(i=>`<span class="${i<stars?'':'off'}">★</span>`).join('')}</div>
    <div class="card"><div class="kv"><span>แต้มวันนี้</span><b>${w.pts}</b></div>${cs.map(([t,ok,p])=>`<div class="kv"><span>${ok?'✓':'✗'} ${esc(t)}</span><b>${ok?'+'+p:'0'}</b></div>`).join('')}
    <div class="kv"><span>ตำแหน่ง</span><b>${RANKS[rankIdx()][1]}</b></div></div>
    ${mentor(`<div>${['วันนี้หลุดไปหลายอย่าง พรุ่งนี้ลองเปิดถาดให้ครบเร็วขึ้นนิดนึง จะได้รู้ว่ามีอะไรด่วน','พอไปได้! ลองเลือกงานให้เข้ากับแรงที่มี งานหนักตอนเช้า งานเบาตอนบ่าย','ดีมาก งานเดินตลอดวัน','สุดยอด! โต๊ะโล่ง ใจก็โล่ง'][stars]}</div>`)}
    <button class="btn big" data-a="next">${S.day===4?'ไปสรุปสัปดาห์':'ไปวัน'+DAYN[S.day+1]}</button></div>`)}
function showWeekend(){
  const wk=S.week_log.reduce((a,w)=>a+(w?w.stars:0),0);
  const avail=Object.keys(PERKS).filter(p=>!S.perks.includes(p)).sort(()=>Math.random()-.5);
  const n=S.reviewed?S.reviewQ:1,choices=avail.slice(0,n);
  S.phase='weekend';
  showScreen(`<div class="scr">${dots()}<h2>สุดสัปดาห์ที่ ${S.week}</h2>
    <div class="card"><div class="kv"><span>ดาวสัปดาห์นี้</span><b>★ ${wk}/15</b></div><div class="kv"><span>ดาวสะสม</span><b>★ ${S.stars}</b></div><div class="kv"><span>ตำแหน่ง</span><b>${RANKS[rankIdx()][1]}</b></div></div>
    ${choices.length?`${mentor(`<div>${S.reviewed?`ทบทวนมาดี เลือกของติดโต๊ะไว้ใช้สัปดาห์หน้าได้ ${n} ตัวเลือก`:'สัปดาห์นี้ไม่ได้ทบทวน เลยมีของให้เลือกแค่อย่างเดียวนะ'}</div>`)}
      <div class="col">${choices.map(p=>`<button class="perk" data-a="perk" data-v="${p}"><span class="i">${PERKS[p][0]}</span><span><b>${PERKS[p][1]}</b><small>${PERKS[p][2]}</small></span></button>`).join('')}</div>`
      :`${mentor('<div>ของติดโต๊ะครบทุกอย่างแล้ว! รับโบนัสแทนนะ</div>')}<button class="btn big" data-a="perk" data-v="">รับ +30 แต้ม</button>`}</div>`)}
function newWeek(p){if(p)S.perks.push(p);else S.score+=30;S.week++;S.day=0;S.week_log=[];S.reviewed=false;startDay()}

// ================= input =================
function act(a,v){
  if(a==='new'){S=fresh();startDay();return}
  if(a==='cont'){S=load();S.phase==='summary'?nextDay():showIntro(0);return}
  if(a==='play'){begin();return}
  if(a==='next'){nextDay();return}
  if(a==='perk'){newWeek(v);return}
  if(!S||S.phase!=='play')return;
  if(a==='p'){resolvePop(v);return}
  if(S.pop.length)return;
  if(a==='close'){closeSheet();after();return}
  if(a==='clar'){S.clar={i:v!=null?+v:0};render();return}
  if(a==='skip'){S.clar.i=(S.clar.i+1)%S.tray.length;render();return}
  if(a==='back'){S.clar.deleg=false;renderClar();return}
  if(a==='to'){const it=S.tray[S.clar.i];if(!it)return;
    if(v==='deleg'){S.clar.deleg=true;renderClar();return}
    const [d,role]=v.split(':');S.clar.deleg=false;const i=S.tray.indexOf(it);S.tray.splice(i,1);
    const done=route(it,d,role);if(!done)S.tray.splice(i,0,it),S.clar.i=i+1;
    if(S.clar.i>=S.tray.length)S.clar.i=0;
    if(!S.tray.length){closeSheet();toast('ถาดว่างแล้ว หัวโล่ง 😌','good')}
    after();return}
  if(a==='mode'){if(v===S.mode)return;advance(perk('shoes')?5:10);S.mode=v;after();return}
  if(a==='work'){const it=S.lists[S.mode].find(x=>x.id==v);if(!it)return;S.lists[S.mode]=S.lists[S.mode].filter(x=>x!==it);doWork(it,true);after();return}
  if(a==='rest'){advance(15);S.energy=Math.min(110,S.energy+15+(perk('coffee')?10:0));toast('พักหายใจ แรงฟื้นนิดหน่อย');after();return}
  if(a==='wait'){const nm=[...S.calendar].sort((a,b)=>a.time-b.time)[0];if(nm&&nm.time>S.min)advance(nm.time-S.min);after();return}
  if(a==='nudge'){const w=S.waiting.find(w=>w.item.id==v);if(!w)return;advance(5);w.stale=false;S.ev=S.ev.filter(e=>!(e.type==='lost'&&e.id===w.item.id));sched(S.min+30,'ret',{id:w.item.id});toast(`ทวง${ROLES[w.role].name}แล้ว`);closeSheet();after();return}
  if(a==='view'){renderView(v);return}
  if(a==='review'){renderView('review');return}
  if(a==='doReview'){closeSheet();advance(60);const q=1+reviewChecks().filter(c=>c[1]).length;S.reviewQ=Math.min(3,q);S.reviewed=true;
    if(S.drawer.length)gain(S.drawer.length*5,'ไอเดียในลิ้นชักกลายเป็นข้อเสนอดี ๆ');toast(`ทบทวนเสร็จ สัปดาห์หน้าได้เลือกของ ${S.reviewQ} อย่าง`,'good');after();return}
  if(a==='home'){endDay();return}
}
document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){act('close');return}
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;act(b.dataset.a,b.dataset.v)});
showTitle();
</script>
